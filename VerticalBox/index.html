<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical-Box</title>
    <style>
        .cardContainer{
            background-color: rgb(181, 149, 253);
            padding: 50px;
            align-items: center;
            text-align: center;
            border-radius: 25px;
        }
        .title{
            color: rgb(72, 25, 117);
            font-size: 50px;
            font-style: italic;
        }
        .container{
            background-color: white;
            margin-bottom: 50px;
            padding: 15px;
            border-radius: 25px;
            box-shadow: 5px 5px rgb(144, 119, 168);
        }

        .container p{
            color: rgb(124, 120, 120);
            font-size: 35px;
            font-weight: 700;
        }

        .container h1{
            font-size: 55px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="cardContainer">
        <h1 class="title">Highest & Average CTC</h1>
        <div class="container">
            <p>Expected Increase in Salary Potential</p>
            <h1>60%</h1>
        </div>
        <div class="container">
            <p>Average CTC</p>
            <h1>₹6.1 LPA</h1>
        </div>
        <div class="container">
            <p>Highest CTTC</p>
            <h1>₹36 LPA</h1>
        </div>
    </div>
</body>
</html>
