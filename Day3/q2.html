<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            padding: 20px;
            font-family: 'Times New Roman', Times, serif;
        } 

        hr{
            height: 3px;
            background-color: rgb(41, 93, 41);;
        }
        .head1{
            background-color: #f7e1e1;
            color: rgb(41, 93, 41);
            padding: 15px;
        }

        .head1 h4{
            font-size: 15px;
            margin-bottom: 15px;
        }

        .head1 p{
            font-size: 50px;
            font-weight: 400;
            margin-top: 20px;
        }
        .head2{
            background-color: rgb(41, 93, 41);;
            color: white;
            padding: 15px;
        }

        .head2 h4{
            font-size: 15px;
            margin-bottom: 15px;
        }

        .head2 p{
            font-size: 50px;
            font-weight: 400;
            margin-top: 20px;
        }
        .head3{
            background-color: #EFE9E3;
            color: rgb(41, 93, 41);;
            padding: 15px;
        }

        .head3 h4{
            font-size: 15px;
            margin-bottom: 15px;
        }

        .head3 p{
            font-size: 50px;
            font-weight: 400;
            margin-top: 20px;
        }
        span{
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="head1">
            <h4>EVERYONE NEEDS INFINITE DREAMS</h4>
            <hr>
            <p><span>Enid</span> is an <span>amplification studio</span> that builds brands that <span>resound</span>.</p>
        </section>
        <section class="head2">
            <h4>EACH NEW IDEA DEFINED</h4>
            <hr>
            <p>We stand firm on <span>our values</span> that sit central to <span>everything we do</span>.</p>
        </section>
        <section class="head3">
            <h4>EVERY NOTE IS DISTINCT</h4>
            <hr>
            <p>We <span>deep-dive</span> into your back catalogue to understand the <span>beat</span></p>
        </section>
    </div>
</body>
</html>
