<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Navigation Bar</title>
  <style>
    * {
      font-family: "Poppins", sans-serif;
      margin: 0;
      padding: 0;
    }

    span{
        color: #0056b3;
        font-size: 35px;
        font-weight: 600;
    }
    footer {
      margin: 10px;
      padding: 10px;
    }

    nav ul {
      list-style-type: none;
      display: flex;
      justify-content: space-evenly;
      background-color: black;
      color: white;
      padding: 10px;
    }

    ul li a{
        text-decoration: none;
        color: white;
        font-weight: 500;
    }

    nav ul li {
      margin: 0 15px;
      margin-top: 10px;
      color: white;
      font-weight: 500;
    }

    .nav-link {
      text-decoration: none;
      font-size: 18px;
      font-weight: 500;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    .nav-link:first-child {
      color: #0056b3;
    }

    footer {
      background-color: #e3e3e3;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <nav>
    <ul>
        <h1><span>Be</span>blog</h1>
        <li><a href="#" class="nav-link">Home</a></li>
        <li><a href="#" >Web Design</a></li>
        <li><a href="#" >WordPress</a></li>
        <li><a href="#" >About</a></li>
        <li><a href="#" >BeAdvice</a></li>
        <li><a href="#">ByBeTheme</a></li>
    </ul>
  </nav>

  <footer>
    &copy; 2025 Beblog. All rights reserved.
  </footer>

</body>
</html>
