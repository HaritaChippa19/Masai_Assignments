<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation Card</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: "Poppins", sans-serif;
    }

    .invitation {
      background-color: #EFE9E3;
      border: 3px solid rgb(1, 66, 1);
      width: 450px;
      text-align: center;
      padding: 25px;
      box-shadow: 12px 10px rgba(1, 66, 1, 0.20);
    }

    .logo {
      width: 300px;
      margin-bottom: 10px;
    }

    h1 {
      color: rgb(1, 66, 1);
      margin-bottom: 10px;
    }

    p {
      color: black;
      line-height: 1.5;
    }

    .btn {
      background-color: rgb(1, 66, 1);;
      color: white;
      padding: 10px 25px;
      font-size: 16px;
      margin-top: 15px;
    }

    .btn:hover {
      background-color: rgb(6, 47, 6);
    }
  </style>
</head>
<body>
    <div class="invitation">
    <img src="https://inkbotdesign.com/wp-content/uploads/2024/05/rolex-logo-design-1024x559.webp" alt="Company Logo" class="logo">

    <h1>You're Invited to Our Grand Launch!</h1>

    <p><b>Date:</b> 20th November 2025</p>
    <p><b>Time:</b> 6:00 PM onwards</p>
    <p><b>Venue:</b> Blue Diamond Convention Hall, City Center</p>

    <p>Join us as we unveil our new company, <b>ROLEX COMPANY</b> — committed to bringing smart technology solutions to life!</p>

    <button class="btn">Join Now!</button>
    </div>
</body>
</html>
