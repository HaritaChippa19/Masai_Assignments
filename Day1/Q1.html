<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <img src="https://cdn.pixabay.com/photo/2023/02/18/11/00/icon-7797704_640.png" alt="Welcome Image">
        <h1>- Ready, Set, Sign Up!</h1>
        <p>Join us today and unlock exclusive access to updates, features, and personalized content. Signing up takes just a moment—start your journey now!</p>
    </header>
    <main>
        <form>
            <h4>Enter Your Name</h4>
            <input type="text">
            <h4>Enter Your Email</h4>
            <input type="email">
            <fieldset>
                <legend>Gender</legend>
                <div class="radios" role="radiogroup" aria-labelledby="gender-legend"><div>
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>
                </div>
                <div>
                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>
                <div>
                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </div></div>
            </fieldset>
            <h4>Age</h4>
            <input type="number" name="age" id="age">

            <button>Sign Up</button>
        </form>
    </main>
    <footer><a class="link" href="https://www.google.com">Click here</a></footer>
</body>
</html>
