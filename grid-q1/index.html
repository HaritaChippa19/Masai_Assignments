<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Grid Layout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px;
            margin-top: 20px;
        }

        .box {
            border: 1px solid #ccc;
            padding: 15px;
            text-align: center;
            color: white;
        }
        .box:nth-child(1) { background: orangered; }
        .box:nth-child(2) { background: rgb(86, 86, 245); }
        .box:nth-child(3) { background: yellow; }
        .box:nth-child(4) { background: rgb(142, 82, 194); }
        .box:nth-child(5) { background: rgb(39, 179, 39); }
        .box:nth-child(6) { background: #2ec4b6; }
        .box:nth-child(7) { background: rgb(230, 171, 121); }
        .box:nth-child(8) { background: #2ec4b6; }
        .box:nth-child(9) { background: browncd; }
    </style>
</head>
<body>

    <h2>Simple Grid Layout</h2>

    <div class="grid-container">

        <div class="box">
            <h1 class="one">2.</h1>
        </div>

        <div class="box">
           <h1>3.</h1>
        </div>

        <div class="box">
            <h1>4.</h1>
        </div>

        <div class="box">
            <h1>5.</h1>
        </div>

        <div class="box">
            <h1>6.</h1>
        </div>

        <div class="box">
            <h1>1.</h1>
        </div>

        <div class="box">
            <h1>7.</h1>
        </div>

        <div class="box">
            <h1>8.</h1>
        </div>

        <div class="box">
            <h1>9.</h1>
        </div>

    </div>

</body>
</html>
